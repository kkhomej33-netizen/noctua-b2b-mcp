[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noctua-b2b-mcp"
version = "1.0.0"
description = "Official MCP server for Noctua Data B2B GTM, Ecommerce Store Leads, and ATS Hiring Signal APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Noctua Data" }
]
keywords = ["mcp", "mcp-server", "b2b-leads", "shopify", "woocommerce", "ats", "apify", "clay"]
dependencies = []

[project.scripts]
noctua-b2b-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
